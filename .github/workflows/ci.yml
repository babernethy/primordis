name: CI

# Lightweight gate: analyze + test on every push to main and every PR.
# Full web (--wasm) and macOS build/sign pipelines land in PRIMORDIS-TASK-010
# and PRIMORDIS-TASK-016. Actions are tag-pinned here; SHA-pinning is a CI
# hardening follow-up (house standard).
on:
  push:
    branches: [main]
  pull_request:

# A force-push or rapid re-push cancels the superseded run instead of
# stacking 20-minute macOS jobs behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    # macOS runner since TASK-801: minigpu's native-asset hook MUST run
    # (`flutter test` refuses to start when a dependency requires native
    # assets and the feature is off), and the hook compiles Dawn. On macOS
    # that is Dawn-over-Metal with no X11/Vulkan system deps — the same build
    # the macOS target ships — and macOS runners are free on public repos.
    # The hook output is cached below: only a minigpu version bump pays the
    # cold Dawn compile again.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner
          key: hooks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          # Any pubspec.lock change (new dep, resolution shift) still restores
          # the previous Dawn build; hooks_runner re-runs the hook only if
          # minigpu's own inputs changed. Without this, every lock change
          # repays the full ~20-minute cold Dawn compile.
          restore-keys: |
            hooks-${{ runner.os }}-${{ runner.arch }}-
      - run: flutter --version
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
